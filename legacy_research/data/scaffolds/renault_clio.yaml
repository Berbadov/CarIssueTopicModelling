meta:
  make: Renault
  model: Clio
  generations: [2, 3, 4, 5]
  corpus_years: [1998, 2026]
  forum_language: tr
  forum_urls:
    - https://www.otoclubturkiye.com/forum/forum/400-clio/
    - https://www.renaultfanclub.com/forums/renault-clio-kulubu.8/

year_cohorts:
  pre_2013:
    label: "Clio II/III era"
    year_min: 1998
    year_max: 2013
    notes: >
      Older-model cohort used for temporal stratification only.

  cohort_2013_2019:
    label: "Clio IV era"
    year_min: 2013
    year_max: 2020
    notes: >
      Mid-generation cohort used for temporal stratification only.

  cohort_2020_plus:
    label: "Clio V era"
    year_min: 2020
    year_max: 2100
    notes: >
      Newer-model cohort used for temporal stratification only.

engine_families:
  - code: D4F
    fuel_type: petrol
    displacements: ["1.2_NA"]
    year_range: [2000, 2014]
    known_issues: []

  - code: H4Bt
    fuel_type: petrol
    displacements: ["0.9_TCE"]
    year_range: [2012, 2024]
    known_issues: []

  - code: H5Ft
    fuel_type: petrol
    displacements: ["1.2_TCE"]
    year_range: [2013, 2018]
    known_issues: []

  - code: H4D
    fuel_type: petrol
    displacements: ["1.0_TCE", "1.0_NA"]
    year_range: [2019, 2026]
    known_issues: []

  - code: K9K
    fuel_type: diesel
    displacements: ["1.5_DCI"]
    year_range: [2001, 2026]
    known_issues: []

transmissions:
  - code: EDC6
    internal_code: DC4
    type: dual_clutch_6speed_dry
    compatible_engines: ["0.9_TCE", "1.2_TCE", "1.5_DCI"]
    year_range: [2012, 2024]
    known_names_tr: ["edc", "otomatik", "cift kavrama", "sanziman"]
    known_issues: []

  - code: JR5
    internal_code: JR5
    type: manual_5speed
    compatible_engines: ["1.2_NA", "0.9_TCE", "1.5_DCI"]
    year_range: [2001, 2024]
    known_names_tr: ["manuel", "duz vites", "el vitesi"]
    known_issues: []
