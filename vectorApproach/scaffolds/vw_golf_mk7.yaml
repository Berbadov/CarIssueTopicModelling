# ──────────────────────────────────────────────────────────────────────────────
# Vehicle Knowledge Scaffold — VW Golf MK7 (2013–2020)
# ──────────────────────────────────────────────────────────────────────────────
# Generation-specific scaffold used by the YouTube extraction pipeline.
# All model constants (engine windows, feature rules, facelift years) live here.
# The pipeline reads this at runtime — no Python changes needed for a new model.
# ──────────────────────────────────────────────────────────────────────────────

meta:
  make: VW
  model: Golf MK7
  generation: MK7
  corpus_years: [2013, 2020]

facelifts:
  - year: 2017
    label: "MK7.5"
    pre_label: "MK7 pre-facelift"

engine_families:

  - code: EA211
    fuel_type: petrol
    timing_drive: belt
    displacements:
      - code: "1.0_TSI"
        year_range: [2016, 2020]
        displacement_cc: 999
        search_alias: ["1.0 TSI", "1.0 turbo"]
      - code: "1.2_TSI"
        year_range: [2013, 2017]
        displacement_cc: 1197
        search_alias: ["1.2 TSI", "1.2 turbo"]
      - code: "1.4_TSI"
        year_range: [2013, 2020]
        displacement_cc: 1395
        power_variants:
          - hp: 122
            label: "122 hp"
            search_alias: ["122 hp", "122 ps", "122 bg", "122 beygir"]
          - hp: 125
            label: "125 hp"
            search_alias: ["125 hp", "125 ps", "125 bg", "125 beygir"]
          - hp: 140
            label: "140 hp (ACT)"
            search_alias: ["140 hp", "140 ps", "140 bg", "140 beygir", "ACT"]
          - hp: 150
            label: "150 hp (ACT)"
            search_alias: ["150 hp", "150 ps", "150 bg", "150 beygir", "ACT", "150'lik"]
        search_alias: ["1.4 TSI", "1.4 turbo"]
      - code: "1.5_TSI"
        year_range: [2017, 2020]
        displacement_cc: 1498
        search_alias: ["1.5 TSI", "1.5 turbo"]

  - code: EA888
    fuel_type: petrol
    timing_drive: chain
    displacements:
      - code: "1.8_TSI"
        year_range: [2013, 2020]
        displacement_cc: 1798
        search_alias: ["1.8 TSI", "1.8 turbo"]
      - code: "2.0_TSI"
        year_range: [2013, 2020]
        displacement_cc: 1984
        search_alias: ["2.0 TSI", "2.0 turbo", "Golf GTI"]

  - code: EA288
    fuel_type: diesel
    timing_drive: belt
    displacements:
      - code: "1.6_TDI"
        year_range: [2013, 2020]
        displacement_cc: 1598
        search_alias: ["1.6 TDI", "1.6 dizel"]
      - code: "2.0_TDI"
        year_range: [2013, 2020]
        displacement_cc: 1968
        search_alias: ["2.0 TDI", "2.0 dizel"]

# ── Performance / enthusiast trims ────────────────────────────────────────────
# Declared so the discovery corpus can be balanced against YouTube's inherent
# performance-trim bias. max_share = max fraction of the final corpus that may
# be sport-trim videos; videos whose titles match a token beyond that cap are
# downsampled. Omit block entirely for models without a performance variant.
performance_trims:
  max_share: 0.2
  tokens:
    - gti
    - "golf r"
    - "mk7 r"
    - "mk7.5 r"

transmissions:
  - code: DQ200
    type: DSG_7speed_dry
    compatible_displacements: ["1.2_TSI", "1.4_TSI"]
    year_range: [2013, 2020]
  - code: DQ250
    type: DSG_6speed_wet
    compatible_displacements: ["1.8_TSI", "2.0_TSI", "2.0_TDI"]
    year_range: [2013, 2020]
  - code: DQ381
    type: DSG_7speed_wet
    compatible_displacements: ["2.0_TSI", "2.0_TDI"]
    year_range: [2017, 2020]

